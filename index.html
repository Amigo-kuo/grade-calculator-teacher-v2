<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114康軒版1～2冊模擬測驗 - 各科等級計算機</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            background-color: #fff; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 900px; 
            width: 100%; 
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            font-size: 24px; 
            margin-bottom: 10px; 
        }
        .description { 
            text-align: center; 
            color: #7f8c8d; 
            margin-bottom: 20px; 
            font-size: 15px; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 20px; 
        }
        th, td { 
            padding: 12px; 
            text-align: center; 
            border: 1px solid #ddd; 
        }
        th { 
            background-color: #4F81BD; 
            color: white; 
            font-size: 16px;
        }
        .input-cell { background-color: #E2EFDA; } /* Green background per original instruction */
        .calc-cell { background-color: #F2F2F2; font-size: 14px; color: #555; }
        .output-cell { background-color: #DDEBF7; font-weight: bold; color: #C00000; font-size: 20px; width: 100px; }
        
        input[type="number"] { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 16px; 
            background: transparent; 
        }
        input[type="number"]:focus { 
            outline: none; 
            border-color: #4F81BD; 
            background-color: #fff; 
            box-shadow: 0 0 5px rgba(79, 129, 189, 0.5);
        }
        
        @media (max-width: 600px) {
            th, td { padding: 8px; font-size: 14px; }
            h1 { font-size: 20px; }
            .output-cell { font-size: 18px; }
            .calc-cell { font-size: 12px; }
        }

        .settings{margin-top:18px;border:1px solid #d8e0e8;border-radius:12px;padding:18px;background:#f8fafc}.settings summary{cursor:pointer;font-weight:700;color:#2c3e50;font-size:17px}.settings-note{color:#64748b;font-size:14px}.threshold-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-top:12px}.threshold-card h3{margin:0 0 10px}.threshold-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.threshold-grid label{display:flex;flex-direction:column;gap:4px;text-align:center;font-size:12px;color:#475569;font-weight:600}.threshold-grid input{width:100%;box-sizing:border-box;padding:7px 4px;text-align:center;border:1px solid #cbd5e1;border-radius:6px}.reset-btn{margin-top:14px;padding:9px 14px;border:0;border-radius:7px;background:#64748b;color:#fff;cursor:pointer}@media(max-width:600px){.threshold-grid{grid-template-columns:repeat(4,1fr)}}
    </style>
</head>
<body>
    <div class="container">
        <h1>114康軒版1～2冊模擬測驗<br>各科等級計算機</h1>
        <p class="description">👉 請於「綠色區塊」輸入各科答對題數，系統會即時自動計算等級。</p>
        
        <table>
            <thead>
                <tr>
                    <th>科目</th>
                    <th>自行輸入<br>(答對題數)</th>
                    <th>總題數/分</th>
                    <th>對應題數/<br>加權分數</th>
                    <th>獲得等級標示</th>
                </tr>
            </thead>
            <tbody>
                <!-- 國文 -->
                <tr>
                    <td>國文</td>
                    <td class="input-cell"><input type="number" id="chinese" min="0" max="42" step="1" placeholder="滿分42" oninput="calculate()"></td>
                    <td>42</td>
                    <td class="calc-cell" id="chinese-score">-</td>
                    <td class="output-cell" id="chinese-grade"></td>
                </tr>
                <!-- 數學 -->
                <tr>
                    <td>數學（選擇）</td>
                    <td class="input-cell"><input type="number" id="math-choice" min="0" max="25" step="1" placeholder="滿分25" oninput="calculate()"></td>
                    <td>25</td>
                    <td rowspan="2" class="calc-cell" id="math-score" style="vertical-align: middle;">-</td>
                    <td rowspan="2" class="output-cell" id="math-grade" style="vertical-align: middle;"></td>
                </tr>
                <tr>
                    <td>數學（非選）</td>
                    <td class="input-cell"><input type="number" id="math-nonchoice" min="0" max="6" step="1" placeholder="滿分6" oninput="calculate()"></td>
                    <td>6</td>
                </tr>
                <!-- 英文 -->
                <tr>
                    <td>英語（閱讀）</td>
                    <td class="input-cell"><input type="number" id="english-read" min="0" max="43" step="1" placeholder="滿分43" oninput="calculate()"></td>
                    <td>43</td>
                    <td rowspan="2" class="calc-cell" id="english-score" style="vertical-align: middle;">-</td>
                    <td rowspan="2" class="output-cell" id="english-grade" style="vertical-align: middle;"></td>
                </tr>
                <tr>
                    <td>英語（英聽）</td>
                    <td class="input-cell"><input type="number" id="english-listen" min="0" max="21" step="1" placeholder="滿分21" oninput="calculate()"></td>
                    <td>21</td>
                </tr>
                <!-- 社會 -->
                <tr>
                    <td>社會</td>
                    <td class="input-cell"><input type="number" id="social" min="0" max="54" step="1" placeholder="滿分54" oninput="calculate()"></td>
                    <td>54</td>
                    <td class="calc-cell" id="social-score">-</td>
                    <td class="output-cell" id="social-grade"></td>
                </tr>
                <!-- 自然 -->
                <tr>
                    <td>自然</td>
                    <td class="input-cell"><input type="number" id="science" min="0" max="50" step="1" placeholder="滿分50" oninput="calculate()"></td>
                    <td>50</td>
                    <td class="calc-cell" id="science-score">-</td>
                    <td class="output-cell" id="science-grade"></td>
                </tr>
            </tbody>
        </table>
        <details class="settings"><summary>⚙️ 教師設定：修改各科等級範圍</summary><p class="settings-note">直接修改各級「最低分數」。設定會自動儲存在此瀏覽器。</p><div id="threshold-editor"></div><button class="reset-btn" onclick="resetThresholds()">恢復原始設定</button></details>
    </div>

    <script>
        // 後台等級對照矩陣 (由大到小排列)
        const defaultThresholds = {
            chinese: [{min:38,g:'A++'},{min:36,g:'A+'},{min:34,g:'A'},{min:29,g:'B++'},{min:25,g:'B+'},{min:16,g:'B'},{min:0,g:'C'}],
            math: [{min:90,g:'A++'},{min:82.3,g:'A+'},{min:72.1,g:'A'},{min:62.8,g:'B++'},{min:55.1,g:'B+'},{min:37.2,g:'B'},{min:0,g:'C'}],
            english: [{min:98.14,g:'A++'},{min:94.42,g:'A+'},{min:86.98,g:'A'},{min:78.58,g:'B++'},{min:67.42,g:'B+'},{min:36.57,g:'B'},{min:0,g:'C'}],
            social: [{min:50,g:'A++'},{min:48,g:'A+'},{min:45,g:'A'},{min:38,g:'B++'},{min:33,g:'B+'},{min:21,g:'B'},{min:0,g:'C'}],
            science: [{min:47,g:'A++'},{min:45,g:'A+'},{min:41,g:'A'},{min:34,g:'B++'},{min:28,g:'B+'},{min:18,g:'B'},{min:0,g:'C'}]
        };
        let thresholds = JSON.parse(localStorage.getItem('gradeThresholds') || 'null') || JSON.parse(JSON.stringify(defaultThresholds));
        function saveThresholds(){ localStorage.setItem('gradeThresholds', JSON.stringify(thresholds)); }
        function renderThresholdEditor(){
            const subjects={chinese:'國文',math:'數學',english:'英語',social:'社會',science:'自然'};
            const grades=['A++','A+','A','B++','B+','B','C']; const box=document.getElementById('threshold-editor'); box.innerHTML='';
            Object.entries(subjects).forEach(([key,name])=>{
                const card=document.createElement('div'); card.className='threshold-card';
                card.innerHTML=`<h3>${name}</h3><div class="threshold-grid"></div>`; const grid=card.querySelector('.threshold-grid');
                grades.forEach((g,i)=>{ const label=document.createElement('label'); label.innerHTML=`<span>${g} 最低分</span><input type="number" step="0.01" value="${thresholds[key][i].min}" data-s="${key}" data-i="${i}">`; grid.appendChild(label); });
                box.appendChild(card);
            });
            box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{ const s=inp.dataset.s,i=+inp.dataset.i; thresholds[s][i].min=+inp.value; thresholds[s].sort((a,b)=>b.min-a.min); saveThresholds(); renderThresholdEditor(); calculate(); }));
        }
        function resetThresholds(){ thresholds=JSON.parse(JSON.stringify(defaultThresholds)); saveThresholds(); renderThresholdEditor(); calculate(); }
 // 教師設定密碼：預設密碼為 114teacher，可自行修改
        const TEACHER_PASSWORD = '114teacher';

        function openTeacherSettings() {
            document.getElementById('password-modal').classList.add('show');
            const input = document.getElementById('teacher-password');
            input.value = '';
            document.getElementById('password-error').textContent = '';
            setTimeout(() => input.focus(), 50);
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.remove('show');
        }

        function verifyTeacherPassword() {
            const input = document.getElementById('teacher-password');
            const error = document.getElementById('password-error');
            if (input.value === TEACHER_PASSWORD) {
                closePasswordModal();
                document.getElementById('threshold-editor').style.display = 'block';
                renderThresholdEditor();
            } else {
                error.textContent = '密碼錯誤，無法開啟教師設定。';
                input.select();
            }
        }

        function closeTeacherSettings() {
            document.getElementById('threshold-editor').style.display = 'none';
        }

        function renderThresholdEditor(){
            const subjects={chinese:'國文',math:'數學',english:'英語',social:'社會',science:'自然'};
            const grades=['A++','A+','A','B++','B+','B','C']; const box=document.getElementById('threshold-editor-content'); box.innerHTML='';
            Object.entries(subjects).forEach(([key,name])=>{
                const card=document.createElement('div'); card.className='threshold-card';
                card.innerHTML=`<h3>${name}</h3><div class="threshold-grid"></div>`; const grid=card.querySelector('.threshold-grid');
                grades.forEach((g,i)=>{ const label=document.createElement('label'); label.innerHTML=`<span>${g} 最低分</span><input type="number" step="0.01" value="${thresholds[key][i].min}" data-s="${key}" data-i="${i}">`; grid.appendChild(label); });
                box.appendChild(card);
            });
            box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{ const s=inp.dataset.s,i=+inp.dataset.i; thresholds[s][i].min=+inp.value; thresholds[s].sort((a,b)=>b.min-a.min); saveThresholds();
        calculate(); }));
        }
        function resetThresholds(){ thresholds=JSON.parse(JSON.stringify(defaultThresholds)); saveThresholds(); renderThresholdEditor(); calculate(); }

        
        // 四捨五入到小數點後兩位
        function round2(num) {
            return Math.round(num * 100) / 100;
        }

        // 判斷邏輯
        function getGrade(subject, value) {
            if(value === '' || isNaN(value)) return '';
            let v = parseFloat(value);
            if (v < 0) return '';
            let arr = thresholds[subject];
            for(let i=0; i<arr.length; i++){
                if(v >= arr[i].min) return arr[i].g;
            }
            return 'C';
        }

        function calculate() {
            // 國文
            let chi = document.getElementById('chinese').value;
            document.getElementById('chinese-score').innerText = chi === '' ? '-' : chi;
            document.getElementById('chinese-grade').innerText = chi === '' ? '' : (chi > 42 ? '錯誤' : getGrade('chinese', chi));

            // 數學
            let mathC = document.getElementById('math-choice').value;
            let mathN = document.getElementById('math-nonchoice').value;
            if(mathC !== '' && mathN !== '') {
                let m_c = parseFloat(mathC);
                let m_n = parseFloat(mathN);
                if (m_c > 25 || m_n > 6) {
                     document.getElementById('math-score').innerText = '錯誤';
                     document.getElementById('math-grade').innerText = '錯誤';
                } else {
                     let mathScore = round2((m_c / 25) * 85 + (m_n / 6) * 15);
                     document.getElementById('math-score').innerText = mathScore;
                     document.getElementById('math-grade').innerText = getGrade('math', mathScore);
                }
            } else {
                document.getElementById('math-score').innerText = '-';
                document.getElementById('math-grade').innerText = '';
            }

            // 英文
            let engR = document.getElementById('english-read').value;
            let engL = document.getElementById('english-listen').value;
            if(engR !== '' && engL !== '') {
                let e_r = parseFloat(engR);
                let e_l = parseFloat(engL);
                if (e_r > 43 || e_l > 21) {
                     document.getElementById('english-score').innerText = '錯誤';
                     document.getElementById('english-grade').innerText = '錯誤';
                } else {
                     let engScore = round2((e_r / 43) * 80 + (e_l / 21) * 20);
                     document.getElementById('english-score').innerText = engScore;
                     document.getElementById('english-grade').innerText = getGrade('english', engScore);
                }
            } else {
                document.getElementById('english-score').innerText = '-';
                document.getElementById('english-grade').innerText = '';
            }

            // 社會
            let soc = document.getElementById('social').value;
            document.getElementById('social-score').innerText = soc === '' ? '-' : soc;
            document.getElementById('social-grade').innerText = soc === '' ? '' : (soc > 54 ? '錯誤' : getGrade('social', soc));

            // 自然
            let sci = document.getElementById('science').value;
            document.getElementById('science-score').innerText = sci === '' ? '-' : sci;
            document.getElementById('science-grade').innerText = sci === '' ? '' : (sci > 50 ? '錯誤' : getGrade('science', sci));
        }
        renderThresholdEditor();
        calculate();
    </script>
</body>
</html>
